name: Build relay release

# Builds the relay binary and attaches it as a release asset.
# server-install.sh pulls from this release. Built with the host
# toolchain (glibc) — most VPSs run Ubuntu/Debian with glibc anyway.

on:
  workflow_dispatch:
  push:
    branches: [feat/windows-shell-profiles]
    paths:
      - 'relay/**'
      - 'relay/Cargo.lock'
      - '.github/workflows/build-relay.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-relay:
    name: Build x86_64 (glibc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay -> target
          cache-on-failure: false

      - name: Build x86_64
        working-directory: relay
        run: cargo build --release

      - name: Package tarball
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/relay-artifacts"
          tar -cJf "$GITHUB_WORKSPACE/relay-artifacts/dinotty-relay-amd64.tar.xz" \
            -C "$GITHUB_WORKSPACE/relay/target/release" \
            "dinotty-relay"

      - name: Determine version
        id: ver
        run: echo "version=relay-v0.12.1" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: false
          files: |
            relay-artifacts/dinotty-relay-amd64.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
