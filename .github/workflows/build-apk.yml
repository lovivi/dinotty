name: Build TWA APK

# Wraps the PWA frontend in a Trusted Web Activity APK using
# Bubblewrap (PWABuilder's CLI). The APK is the same frontend the
# relay already serves — when the phone opens it, it loads
# `<relay>/?desktop_id=...#...` (the URL produced by `local-connect.sh`)
# and the frontend's <RemoteScreen> takes over.

on:
  workflow_dispatch:
  push:
    branches: [feat/apk-relay]
    paths:
      - 'frontend/**'
      - 'relay/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build TWA APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust (for relay binary if needed)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      # Build the relay binary so the same CI can also publish it as
      # an artifact (handy for self-hosting the relay on a VPS).
      - name: Build relay binary
        working-directory: relay
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "no relay/Cargo.toml — skipping relay build"
          else
            cargo build --release
          fi

      # Use Bubblewrap (Google's TWA builder CLI) to wrap the PWA into
      # a TWA. Bubblewrap accepts a manifest URL or local file and
      # produces an Android project that loads the start_url in a
      # Trusted WebView, signed with a debug key for distribution.
      - name: Install bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate TWA project + build APK
        run: |
          # Bubblewrap's `init` is interactive. Drive it via env vars
          # and a pre-written twa-manifest.json. We pass the manifest
          # file path as the positional arg so it skips the
          # "enter your PWA URL" prompt.
          export BUBBLEWRAP_INIT_NONINTERACTIVE=1
          cat > twa-manifest.json <<'EOF'
          {
            "name": "Dinotty",
            "short_name": "Dinotty",
            "start_url": "/?desktop_id=DEMO&twa=1",
            "display": "standalone",
            "background_color": "#000000",
            "theme_color": "#1E1E1E",
            "icons": [
              { "src": "frontend/dist/icons/icon-192.png", "sizes": "192x192", "type": "image/png" },
              { "src": "frontend/dist/icons/icon-512.png", "sizes": "512x512", "type": "image/png" }
            ]
          }
          EOF
          # Generate Android project in ./android-app from the manifest
          bubblewrap init --manifest=twa-manifest.json \
            --directory=android-app 2>&1 | tee bubblewrap.log || {
              echo "bubblewrap init failed:" >&2
              cat bubblewrap.log >&2
              exit 1
            }
          # Build the APK. Bubblewrap's `build` runs gradle assembleDebug.
          cd android-app
          ./gradlew assembleDebug 2>&1 | tee -a ../bubblewrap.log || {
              echo "gradle build failed:" >&2
              cat ../bubblewrap.log >&2
              exit 1
            }
          # Find the produced APK
          find app/build/outputs/apk -name '*.apk' -type f | head -1

      - name: Locate APK
        id: locate
        run: |
          APK_PATH=$(find android-app/app/build/outputs/apk -name '*.apk' -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::no .apk found under android-app/app/build/outputs/apk/"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dinotty-mobile-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload relay binary (if built)
        if: hashFiles('relay/Cargo.toml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dinotty-relay
          path: relay/target/release/dinotty-relay
          if-no-files-found: warn
