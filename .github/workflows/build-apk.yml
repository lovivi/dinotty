name: Build Android APK

# Builds the TWA shell APK (deploy/twa/) using its self-contained build.sh.
# The bubblewrap path was abandoned — build.sh drives aapt2/d8/zipalign/
# apksigner directly and only needs the Android SDK + JDK 17.
#
# Trigger: push to feat/apk-relay (the APK development branch) or manual run.
on:
  workflow_dispatch:
  push:
    branches: [feat/apk-relay]
    paths:
      - 'deploy/twa/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build signed debug APK
    runs-on: ubuntu-latest

    # android-actions/setup-android exports ANDROID_HOME / ANDROID_SDK_ROOT
    # into the runner environment for subsequent steps, so we don't need
    # to set them here.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install Android SDK packages. The runner pre-installs cmdline-tools
      # 16.0 at /usr/local/lib/android/sdk/cmdline-tools/latest. We don't
      # use the action's `packages:` field because the versioned package
      # names (build-tools;35.0.0, platform;android-35) trigger "Failed
      # to find package" errors against this cmdline-tools 16.0; calling
      # sdkmanager directly with the right names works.
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35"
          echo "--- installed packages ---"
          sdkmanager --list_installed | grep -E "build-tools|platform-tools|platforms;android"

      # Cache the installed SDK packages so subsequent runs skip the
      # ~1 min sdkmanager download. The cache key is bumped when
      # cmdline-tools-version or the package list changes.
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.workspace }}/android-sdk/build-tools
            ${{ runner.workspace }}/android-sdk/platforms
            ${{ runner.workspace }}/android-sdk/cmdline-tools
          key: ${{ runner.os }}-android-sdk-cmdline-preinstalled-bt35.0.0-p35
          restore-keys: |
            ${{ runner.os }}-android-sdk-cmdline-

      - name: Make build.sh executable
        run: chmod +x deploy/twa/build.sh

      # build.sh honors ANDROID_HOME first, then ANDROID_SDK_ROOT, then
      # JAVA_HOME. android-actions/setup-android exports both, so the
      # child step inherits them automatically — no explicit `env:` here.
      - name: Build APK
        run: deploy/twa/build.sh

      - name: Verify APK was produced
        run: |
          if [ ! -f deploy/twa/build/app.apk ]; then
            echo "::error::APK not produced at deploy/twa/build/app.apk"
            exit 1
          fi
          ls -la deploy/twa/build/app.apk
          echo
          echo "Install: adb install deploy/twa/build/app.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dinotty-mobile-apk
          path: deploy/twa/build/app.apk
          if-no-files-found: error
          retention-days: 30