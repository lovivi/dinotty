<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dinotty</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0F172A;
    color: #E2E8F0;
    font-family: -apple-system, Roboto, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    gap: 24px;
    text-align: center;
  }
  .logo {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #E2E8F0;
  }
  .logo span { color: #7C3AED; }

  /* Spinner */
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #1E293B;
    border-top-color: #7C3AED;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hint {
    font-size: 14px;
    color: #94A3B8;
    max-width: 320px;
    line-height: 1.6;
  }
  .hint strong {
    color: #38BDF8;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Dino<span>tty</span></div>
  <div class="spinner"></div>
  <p class="hint">
    Open the APK via the QR code from your desktop's
    <strong>Remote</strong> settings, or enter the relay URL manually.
  </p>
</div>
</body>
</html>
